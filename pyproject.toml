[project]
name = "codetrace"
version = "0.1.0"
description = "Detecting training data provenance in LLMs for source code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "truststore>=0.10.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codetrace"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
